name: dairyfarm

services:
  dairy-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dairymonitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: dairymonitor
    volumes:
      - dairy_postgres_data:/var/lib/postgresql/data
    networks:
      - dairy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dairymonitor -d dairymonitor"]
      interval: 10s
      timeout: 5s
      retries: 10

  dairy-backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      APP_ORIGIN: https://dairy.bizforce-crm.online
      DATABASE_URL: postgresql://dairymonitor:${POSTGRES_PASSWORD}@dairy-db:5432/dairymonitor
    depends_on:
      dairy-db:
        condition: service_healthy
    networks:
      - dairy
      - proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  dairy-frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://dairy-backend:4000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_URL: http://dairy-backend:4000
    depends_on:
      dairy-backend:
        condition: service_healthy
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  dairy:
    driver: bridge
  proxy:
    external: true
    name: bizforce-crm_backend

volumes:
  dairy_postgres_data:
